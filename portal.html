/* ================= dados de demonstração ================= */
function seed(){
  const logs = [];
  return {
    v:2, role:signedIn.role, auditHead:initializeAudit(logs),
    res:[], equip:[], os:[], itens:[], movs:[], check:{}, notifs:[], logs,
    seq:{r:2001,os:101,mc:1}
  };
}

/* ================= estado ================= */
const KEY='syslab-unifev-demo-v2:'+signedIn.email;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===2){
  if(!Object.hasOwn(s,'auditHead') && s.logs.every(entry=>!Object.hasOwn(entry,'hash'))){
    s.auditHead=initializeAudit(s.logs);
    localStorage.setItem(KEY,JSON.stringify(s));
  }
  return s;
}}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
S.role=signedIn.role;
Object.assign(S,signedIn.stock);
const blankForm=()=>({lab:'ELE',data:'',slot:'',fin:'aula',disciplina:'',alunos:'',tccAlunos:'',hw:[],materiais:'',roteiro:'',obs:'',email:true,errors:{}});
const UI={view:NAV[S.role][0].v,lab:'ELE',form:blankForm(),minhas:'todas',filaSel:new Set(),filaLab:'todos',eqBusca:'',eqLab:'todos',eqSit:'todos',osFiltro:'emaberto',alBusca:'',ckTab:'hoje',tiPerfil:'todos',tiBusca:'',bell:false,fc:null};
const me=()=>{const id=ROLES[S.role].user;return {id,...PEOPLE[id],nome:signedIn.name,papel:ROLES[S.role].label,ini:signedIn.name.slice(0,2).toUpperCase()}};
const isProf=()=>S.role==='professor';

/* ================= regras ================= */
const resIn=(lab,data,slot)=>S.res.filter(r=>r.lab===lab&&r.data===data&&r.slot===slot);
const aprovadaEm=(l,d,s)=>resIn(l,d,s).find(r=>r.status==='aprovada');
const pendentesEm=(l,d,s)=>resIn(l,d,s).filter(r=>r.status==='pendente');
function hwOcupado(id,data,slot,exceptId){return S.res.some(r=>r.id!==exceptId&&r.data===data&&r.slot===slot&&r.status==='aprovada'&&r.hw.includes(id))}
function osAbertas(eqId){return S.os.filter(o=>o.eqId===eqId&&o.status!=='concluida')}
function eff(e){
  const ab=osAbertas(e.id);
  if(ab.some(o=>o.status==='andamento'))return 'manutencao';
  if(ab.some(o=>o.tipo==='corretiva'))return 'avaria';
  return diffDays(parseD(e.prox),TODAY)<=30?'proximo':'ok';
}
const disponivel=e=>['ok','proximo'].includes(eff(e));
function stockSt(i){return i.qtd<=0?'zerado':i.qtd<=i.min?'baixo':'ok'}
const STK={ok:['Em estoque','b-ok'],baixo:['Abaixo do mínimo','b-warn'],zerado:['Zerado','b-bad']};
function log(userId,acao,detalhe){
  const entry = {em:new Date().toISOString(),userId,acao,detalhe};
  const previous = S.logs.at(-1)?.hash ?? '00000000';
  entry.hash = auditCode(previous,entry);
  S.logs.push(entry);
  if(S.auditHead?.count === S.logs.length-1 && S.auditHead.hash === previous){
    S.auditHead = {count:S.logs.length,hash:entry.hash};
  }
}
function notify(userId,titulo,texto,tipo='info'){S.notifs.push({id:'N'+Math.random().toString(36).slice(2,8),userId,titulo,texto,tipo,em:new Date().toISOString(),lida:false})}
function hist(r,userId,acao,texto='',k='info'){r.hist=r.hist||[];r.hist.push({em:new Date().toISOString(),userId,acao,texto,k})}
function slaInfo(r){
  const rem=(new Date(r.criada).getTime()+PRAZO_H*36e5-Date.now())/36e5;
  const pct=Math.max(0,Math.min(100,rem/PRAZO_H*100));
  let t,k;
  if(rem<=0){t='Prazo vencido';k='bad'}
  else if(rem<1){t='Vence em minutos';k='bad'}
  else if(rem<24){t=`Vence em ${Math.floor(rem)} h`;k=rem<12?'bad':'warn'}
  else{t=`Vence em ${Math.floor(rem/24)} d ${Math.floor(rem%24)} h`;k='ok'}
  return {rem,pct,t,k};
}

/* ================= checklists ================= */
function checkItems(r){
  const L=LABS[r.lab];
  const pre=[['sala',L.bancadas?`Preparar as ${L.bancadas} bancadas para ${r.alunos} pessoas`:`Organizar o ${L.curto} para ${r.alunos} pessoas`]];
  r.hw.forEach(id=>pre.push(['eq:'+id,`Separar e testar: ${eqName(id)} (${id})`]));
  if(r.materiais)pre.push(['mat',`Separar materiais: ${r.materiais}`]);
  pre.push(['rot',r.roteiro?`Conferir o roteiro (${r.roteiro})`:'Confirmar a atividade com o professor']);
  const pos=[];
  r.hw.forEach(id=>pos.push(['eq:'+id,`Conferir estado: ${eqName(id)} (${id})`]));
  pos.push(['comp','Verificar componentes devolvidos'],['dano','Verificar bancadas, cabos e tomadas'],['org','Reorganizar e desligar o laboratório']);
  return {pre,pos};
}
function ckState(r,fase){const c=S.check[r.id]||{};const st=c[fase]||{};return k=>!!(st.all||st[k])}
function ckProgress(r,fase){const items=checkItems(r)[fase];const has=ckState(r,fase);const done=items.filter(([k])=>has(k)).length;return {done,total:items.length}}
function checkPendentes(){
  const t=ymd(TODAY), past3=ymd(addDays(TODAY,-3));
  return S.res.filter(r=>r.status==='aprovada'&&r.data>=past3&&r.data<=t).filter(r=>{
    const p=ckProgress(r,'pre'), q=ckProgress(r,'pos');
    return r.data===t?(p.done<p.total||q.done<q.total):q.done<q.total;
  });
}

/* ================= avisos visuais ================= */
function toast(title,text='',kind='ok'){
  const el=document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML=`<span class="ti">${ic(kind==='bad'?'alert':'check')}</span><div><b>${esc(title)}</b>${text?`<p>${esc(text)}</p>`:''}</div>`;
  $('#toasts').append(el);trimToasts();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},4600);
}
function mailToast(userId,assunto,corpo){
  const p=PEOPLE[userId];if(!p||!p.email)return;
  const el=document.createElement('div');
  el.className='toast mail';
  el.innerHTML=`<div class="mailh"><span class="maili">${ic('mail')}</span><span><b>E-mail, envio simulado</b> para ${esc(p.email)}</span></div><div class="mailb"><b>${esc(assunto)}</b>${esc(corpo)}</div>`;
  $('#toasts').append(el);trimToasts();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},7000);
}
function trimToasts(){const b=$('#toasts');while(b.children.length>4)b.firstElementChild.remove()}
function avisar(r,kind){
  const l=LABS[r.lab].curto, when=`${fD(r.data)}, ${slotOf(r.slot).h}`;
  const map={
    aprovada:['Reserva aprovada',`${r.id} no ${l} está confirmada para ${when}.`,'ok',`[SysLab] Reserva ${r.id} aprovada`,`Olá, ${first(r.nome)}. Sua reserva do ${l} para ${when} (${r.disciplina}) foi aprovada.`],
    recusada:['Reserva recusada',`${r.id} no ${l} foi recusada. Motivo: ${r.motivo}`,'bad',`[SysLab] Reserva ${r.id} recusada`,`Olá, ${first(r.nome)}. Sua solicitação do ${l} para ${when} foi recusada. Motivo: ${r.motivo}`],
    cancelada:['Reserva cancelada',`${r.id} no ${l} foi cancelada pela responsável. Motivo: ${r.motivo}`,'bad',`[SysLab] Reserva ${r.id} cancelada`,`Olá, ${first(r.nome)}. A reserva do ${l} para ${when} foi cancelada. Motivo: ${r.motivo}`]
  };
  const [t,x,k,sub,body]=map[kind];

}

const modals=[];
function openModal({title,body,foot='',size=''}){
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button class="iconbtn sm" data-act="close" aria-label="Fechar">${ic('x')}</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  document.body.append(ov);modals.push(ov);
  setTimeout(()=>{const f=ov.querySelector('[autofocus]')||ov.querySelector('.mh button');f&&f.focus()},40);
  return ov;
}
function closeModal(){const ov=modals.pop();if(ov)ov.remove()}
function closeAll(){while(modals.length)closeModal()}

}
function agendaCard(){
  const lab=LABS[UI.lab], w0=sow(TODAY), w1=addDays(w0,7);

  const conf=Object.values(keys).filter(n=>n>1).length;
  const rng=w=>{const e=addDays(w,4);return w.getMonth()===e.getMonth()?`${w.getDate()} a ${e.getDate()} de ${MESL[e.getMonth()]}`:`${w.getDate()}/${pad(w.getMonth()+1)} a ${e.getDate()}/${pad(e.getMonth()+1)}`};

  });

    <div class="ag-top"><div><h2>${lab.nome}</h2><p>${lab.foco}. ${labInfo(lab)}.</p></div>

      ${prof?`<span class="lg"><i class="sw free"></i>Livre, clique para solicitar</span>`:''}

      ${prof?`<span class="lg"><i class="sw lock"></i>Menos de ${ANTECEDENCIA} dias</span><span class="lg"><i class="sw youlg">Você</i>Seu pedido</span>`:''}
      <span class="lg">Sábados só com pedido justificado, pelo calendário completo</span>
    </div>
  </section>`;

function cellHTML(lab,dObj,s,tf){
  const D=ymd(dObj), past=dObj<TODAY, prof=isProf();
  const ap=aprovadaEm(lab,D,s.id), pend=pendentesEm(lab,D,s.id);
  const mine=prof&&resIn(lab,D,s.id).some(r=>ACTIVE.includes(r.status)&&r.userId===me().id);
  const bookable=prof&&!past&&dObj>=MIN_DATE&&!ap;
  const locked=prof&&!past&&dObj<MIN_DATE;
  let cls='slot',inner='',a='none',lbl='';
  if(ap){cls+=' s-aula';inner=`<span class="t">${FINS[ap.fin].t}</span><span class="s">${esc(shortName(ap.nome))}</span>`;lbl=`${FINS[ap.fin].t}, ${ap.nome}`}
  else if(pend.length>1){cls+=' s-conf';inner=`<span class="t">${pend.length} pedidos</span><span class="s">Conflito</span>`;lbl=`${pend.length} pedidos em conflito`}
  else if(pend.length){cls+=' s-aulap';inner=`<span class="t">Em análise</span><span class="s">${esc(shortName(pend[0].nome))}</span>`;lbl=`Pedido em análise de ${pend[0].nome}`}
  else if(bookable){cls+=' s-free';inner='<span class="hint">+ Solicitar</span>';lbl='Livre'}
  if(locked)cls+=' s-locked';

  if(ap||pend.length)a='cell-detail';else if(bookable)a='cell-book';

  return `<div class="cell${tf}"><button class="${cls}" data-act="${a}" data-lab="${lab}" data-date="${D}" data-slot="${s.id}" ${a==='none'?'disabled':''} aria-label="${esc(aria)}">${inner}</button></div>`;
}

    else if(d.getDay()===6&&!f.obs.trim())errs.obs='Aos sábados, explique o motivo do pedido.';
  }
  if(!f.slot)errs.slot='Escolha o horário.';
  if(f.data&&f.slot&&!errs.data){
    const ap=aprovadaEm(f.lab,f.data,f.slot);
    if(ap)errs.slot='Este horário já está reservado. Escolha outro.';
    const dup=S.res.find(r=>r.userId===u.id&&r.lab===f.lab&&r.data===f.data&&r.slot===f.slot&&r.status==='pendente');
    if(dup&&!errs.slot)errs.slot=`Você já tem o pedido ${dup.id} neste horário.`;
  }
  if(!f.disciplina.trim())errs.disciplina=f.fin==='projeto'?'Informe o projeto ou evento.':'Informe a disciplina.';
  const n=+f.alunos;
  if(!n||n<1)errs.alunos='Informe quantas pessoas vão usar o laboratório.';
  else if(n>L.cap)errs.alunos=`O ${L.curto} comporta até ${L.cap} pessoas.`;
  if(f.fin==='tcc'&&!f.tccAlunos.trim())errs.tccAlunos='Informe os alunos do TCC.';
  if(Object.keys(errs).length){
    f.errors=errs;renderForm();
    const fe=$('#form-card .err');if(fe)fe.closest('.field').scrollIntoView({behavior:'smooth',block:'center'});
    toast('Revise a solicitação','Alguns campos precisam de ajuste.','bad');return;
  }
  const hw=f.hw.filter(id=>{const q=eqOf(id);return q&&disponivel(q)&&!hwOcupado(id,f.data,f.slot)});
  const r={id:'R-'+(S.seq.r++),userId:u.id,nome:u.nome,lab:f.lab,data:f.data,slot:f.slot,fin:f.fin,disciplina:f.disciplina.trim(),alunos:n,tccAlunos:f.fin==='tcc'?f.tccAlunos.trim():'',hw,materiais:f.materiais.trim(),roteiro:f.roteiro,obs:f.obs.trim(),status:'pendente',criada:new Date().toISOString(),motivo:'',email:f.email,hist:[]};
  hist(r,u.id,'Solicitação enviada');
  S.res.push(r);
  const others=pendentesEm(r.lab,r.data,r.slot).filter(x=>x.id!==r.id);
  log(u.id,'Solicitou reserva',`${r.id}, ${L.curto}, ${fD(r.data)} ${slotOf(r.slot).h}`);
  notify('carla','Nova solicitação',`${u.nome} pediu o ${L.curto} para ${fD(r.data)} (${FINS[r.fin].t}).`,'info');
  if(others.length){
    notify('carla','Conflito de horário',`${r.id} disputa o mesmo horário com ${others.map(x=>x.id).join(', ')}.`,'warn');
    log('sistema','Detectou conflito',`${r.id} com ${others.map(x=>x.id).join(', ')}`);
  }
  notify(u.id,'Solicitação enviada',`${r.id} aguarda análise. A resposta sai em até 2 dias.`,'info');
  toast('Solicitação enviada',`${r.id} foi para a responsável pelo laboratório.`);
  if(r.email)mailToast(u.id,`[SysLab] Recebemos sua solicitação ${r.id}`,`Pedido do ${L.curto} para ${fD(r.data)}, ${slotOf(r.slot).h}. Você recebe a resposta em até 2 dias.`);
  UI.form=blankForm();UI.form.lab=r.lab;
  save();renderAll();window.scrollTo({top:0,behavior:'smooth'});
}

function openFC(){

  openModal({title:'Calendário completo',size:'m-xl',body:'<div id="fc"></div>'});
  renderFC();
}
function renderFC(){
  const el=$('#fc');if(!el)return;
  const {month,week}=UI.fc, prof=isProf();
  const start=sow(month), wkEnd=addDays(week,6);
  let mg=['S','T','Q','Q','S','S','D'].map(x=>`<span class="wdh">${x}</span>`).join('');
  for(let i=0;i<42;i++){

  SLOTS.forEach((s,i)=>{

    days.forEach(d=>{
      const D=ymd(d), past=d<TODAY, lock=prof&&!past&&d<MIN_DATE;

        else if(pend.length)pills+=P('pend',`${LABS[l].curto}: em análise`);
      });
      const canAdd=prof&&!past&&d>=MIN_DATE&&!aprovadaEm(UI.lab,D,s.id);
      wg+=`<div class="wcell${tf} ${past?'past':''} ${lock?'lock':''}">${pills}${canAdd?`<button class="addbtn" data-act="fc-book" data-date="${D}" data-slot="${s.id}">+ ${LABS[UI.lab].curto}</button>`:''}</div>`;
    });
  });

  el.innerHTML=`<div class="fc">

      <div class="mnav"><button class="iconbtn sm" data-act="fc-m" data-n="-1" aria-label="Mês anterior">${ic('chevL')}</button><b>${MESL[month.getMonth()]} ${month.getFullYear()}</b><button class="iconbtn sm" data-act="fc-m" data-n="1" aria-label="Próximo mês">${ic('chevR')}</button></div>
      <div class="mg">${mg}</div>
      <div class="fcleg">
        ${Object.values(LABS).map(l=>`<span class="lg"><i class="sw" style="background:${l.cor};width:12px;height:12px;border-radius:50%"></i>${l.nome}</span>`).join('')}
        <span class="lg"><i class="sw conf"></i>Pedidos em conflito</span>
        ${prof?`<span class="lg">Os botões de solicitar usam o laboratório escolhido nas abas: ${LABS[UI.lab].curto}</span>`:''}

      <div class="tblwrap"><div class="wg" style="grid-template-columns:118px repeat(6,minmax(118px,1fr));min-width:830px">${wg}</div></div>
    </div></div>`;
}

function pgMinhas(){
  const u=me(), all=S.res.filter(r=>r.userId===u.id);
  const groups={todas:all,pendente:all.filter(r=>r.status==='pendente'),aprovada:all.filter(r=>r.status==='aprovada'),encerradas:all.filter(r=>['recusada','cancelada'].includes(r.status))};
  const labels={todas:'Todas',pendente:'Em análise',aprovada:'Aprovadas',encerradas:'Recusadas e canceladas'};
  const list=groups[UI.minhas].slice().sort((a,b)=>{
    const fa=parseD(a.data)>=TODAY, fb=parseD(b.data)>=TODAY;

/* ================= painel ================= */
function pgPainel(){
  const pend=S.res.filter(r=>r.status==='pendente');
  const w0=sow(TODAY), w1=addDays(w0,7);
  const wf=ymd(w0), wt=ymd(addDays(w0,5));
  const aulasSemana=S.res.filter(r=>r.status==='aprovada'&&r.data>=wf&&r.data<=wt).length;
  const indisp=S.equip.filter(e=>!disponivel(e)).length;
  const repor=S.itens.filter(i=>i.qtd<=i.min).length;
  const total2w=SLOTS.length*10;
  const to2=ymd(addDays(w1,4));
  const ocup=LAB_IDS.map(l=>{const n=S.res.filter(r=>r.lab===l&&r.status==='aprovada'&&r.data>=wf&&r.data<=to2).length;return {l,n,p:Math.round(n/total2w*100)}});
  const maxO=Math.max(1,...ocup.map(o=>o.n));

  const byFin=Object.keys(FINS).map(k=>({k,n:act.filter(r=>r.fin===k).length}));

  const months=[];for(let i=5;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);months.push(d)}

  const maxM=Math.max(1,...mdata.map(x=>x.p+x.c));
  const lim=Date.now()-90*864e5;
  const cons={};S.movs.filter(m=>m.tipo==='saida'&&new Date(m.em).getTime()>=lim).forEach(m=>{cons[m.itemId]=(cons[m.itemId]||0)+m.qtd});
  const topC=Object.entries(cons).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC=Math.max(1,...topC.map(x=>x[1]));
  const alerts=[];
  pend.filter(r=>slaInfo(r).rem<12).forEach(r=>alerts.push(['bad','clock',`${r.id} vence em breve`,`${r.nome}, ${LABS[r.lab].curto}`,'fila']));
  const confKeys={};pend.forEach(r=>{const k=r.lab+r.data+r.slot;(confKeys[k]=confKeys[k]||[]).push(r)});
  Object.values(confKeys).filter(g=>g.length>1).forEach(g=>alerts.push(['warn','alert',`Conflito: ${g.map(r=>r.id).join(' e ')}`,`${LABS[g[0].lab].curto}, ${fD(g[0].data)}, ${slotOf(g[0].slot).h}`,'fila']));
  S.equip.filter(e=>eff(e)==='avaria').forEach(e=>alerts.push(['bad','wrench',`${e.nome} com avaria`,`${e.id}, ${LABS[e.lab].curto}`,'manut']));
  S.equip.filter(e=>eff(e)==='proximo').forEach(e=>alerts.push(['maint','calendar',`Preventiva de ${e.nome}`,`${e.id}, prevista para ${fDY(e.prox)}`,'manut']));
  S.itens.filter(i=>i.qtd<=i.min).forEach(i=>alerts.push([i.qtd<=0?'bad':'warn','box',`${i.nome}: ${i.qtd<=0?'zerado':'abaixo do mínimo'}`,`${i.qtd} de ${i.min} ${i.un}`,'almox']));
  const hoje=S.res.filter(r=>r.status==='aprovada'&&r.data===ymd(TODAY)).sort((a,b)=>slotIdx(a.slot)-slotIdx(b.slot));
  return phead(`Olá, ${first(me().nome)}`,`Resumo dos laboratórios em ${fDL(ymd(TODAY))}.`,`<button class="btn primary" data-act="nav" data-v="fila">${ic('inbox')}Ver solicitações</button>`)+`
  <section class="panel kpis">
    <div class="kpi ${pend.length?'pr':''}"><b>${pend.length}</b><span>solicitações para analisar</span></div>
    <div class="kpi"><b>${aulasSemana}</b><span>reservas nesta semana</span></div>
    <div class="kpi ${indisp?'hot':''}"><b>${indisp}</b><span>equipamentos indisponíveis</span></div>
    <div class="kpi ${repor?'hot':''}"><b>${repor}</b><span>materiais para repor</span></div>
  </section>
  <div class="dash">
    <section class="panel"><div class="ph"><h2>Hoje nos laboratórios</h2><p>${hoje.length?plural(hoje.length,'reserva confirmada','reservas confirmadas'):'Nenhuma reserva para hoje.'}</p></div>
      ${hoje.length?`<ul class="alerts">${hoje.map(r=>{const p=ckProgress(r,'pre'),q=ckProgress(r,'pos');return `<li style="${labVars(r.lab)};cursor:pointer" data-act="nav" data-v="check"><span class="ai info" style="background:${LABS[r.lab].cor};color:#fff">${ic('calendar')}</span><div class="tx"><b>${slotOf(r.slot).h}, ${LABS[r.lab].curto}</b><span>${esc(r.nome)}, ${esc(r.disciplina)}. Checklist: pré ${p.done}/${p.total}, pós ${q.done}/${q.total}</span></div></li>`}).join('')}</ul>`:'<p class="empty">Aproveite para organizar o almoxarifado.</p>'}

/* ================= solicitações ================= */
function pgFila(){
  const all=S.res.filter(r=>r.status==='pendente');
  let pend=all.slice();
  if(UI.filaLab!=='todos')pend=pend.filter(r=>r.lab===UI.filaLab);
  pend.sort((a,b)=>a.data.localeCompare(b.data)||slotIdx(a.slot)-slotIdx(b.slot)||a.lab.localeCompare(b.lab)||a.criada.localeCompare(b.criada));
  const ids=new Set(pend.map(r=>r.id));
  UI.filaSel.forEach(id=>{if(!ids.has(id))UI.filaSel.delete(id)});
  const confSet=new Set();
  all.forEach(r=>{if(pendentesEm(r.lab,r.data,r.slot).length>1)confSet.add(r.id)});
  const urg=all.filter(r=>slaInfo(r).rem<12).length;
  const nsel=UI.filaSel.size, allSel=pend.length>0&&nsel===pend.length;
  const rows=pend.map(r=>{
    const s=slotOf(r.slot), sla=slaInfo(r);
    const others=pendentesEm(r.lab,r.data,r.slot).filter(x=>x.id!==r.id);
    const ap=aprovadaEm(r.lab,r.data,r.slot);
    let conf='';
    if(ap)conf=`<span class="conf bad">${ic('alert')}Horário já reservado (${ap.id})</span>`;
    else if(others.length)conf=`<span class="conf">${ic('alert')}Conflito com ${others.map(x=>`${x.id} (${FINS[x.fin].t})`).join(', ')}</span>`;
    return `<tr class="${UI.filaSel.has(r.id)?'sel':''}">
      <td><input type="checkbox" data-sel="${r.id}" ${UI.filaSel.has(r.id)?'checked':''} aria-label="Selecionar ${r.id}"></td>
      <td><b>${esc(r.nome)}</b><small class="clip" title="${esc(r.disciplina)}">${esc(r.disciplina)}${r.tccAlunos?`. ${esc(r.tccAlunos)}`:''}</small>${conf}</td>
      <td>${finBadge(r.fin)}</td>
      <td>${labChip(r.lab)}<small>${r.alunos} pessoas${r.hw.length?`, ${r.hw.length} equip.`:''}</small></td>
      <td class="num"><b>${fD(r.data)}</b><small>${s.h}</small></td>
      <td><div class="sla ${sla.k}"><div class="t">${sla.t}</div><span class="bar"><i style="width:${sla.pct}%"></i></span></div></td>
      <td class="acts"><button class="btn sm ghost" data-act="det" data-id="${r.id}" aria-label="Detalhes de ${r.id}" title="Detalhes">${ic('eye')}</button><button class="btn sm" data-act="recusar" data-id="${r.id}">Recusar</button><button class="btn sm primary" data-act="aprovar" data-id="${r.id}">Aprovar</button></td>
    </tr>`;
  }).join('');
  return phead('Solicitações','Todos os pedidos em análise, em ordem de data da aula. Quando dois pedidos disputam o mesmo horário, você escolhe qual fica.',
    `<select class="input" data-f="filaLab" aria-label="Filtrar por laboratório"><option value="todos">Todos os laboratórios</option>${Object.values(LABS).map(l=>`<option value="${l.id}" ${UI.filaLab===l.id?'selected':''}>${l.curto}</option>`).join('')}</select>`)+`
  <section class="panel kpis">
    <div class="kpi"><b>${all.length}</b><span>em análise</span></div>
    <div class="kpi ${confSet.size?'pr':''}"><b>${confSet.size}</b><span>pedidos em conflito</span></div>
    <div class="kpi ${urg?'hot':''}"><b>${urg}</b><span>vencem em menos de 12 h</span></div>
    <div class="kpi"><b>${S.res.filter(r=>r.status==='aprovada'&&parseD(r.data)>=TODAY).length}</b><span>reservas futuras confirmadas</span></div>
  </section>
  <section class="panel">
    ${pend.length?`<div class="bulk"><label><input type="checkbox" data-selall ${allSel?'checked':''}>Selecionar todas</label><span class="spacer"></span><span class="help">${nsel?`${nsel} selecionada${nsel>1?'s':''}. Pedidos em conflito ficam de fora da aprovação em lote.`:'Selecione para aprovar várias de uma vez'}</span><button class="btn sm primary" data-act="aprovar-lote" ${nsel?'':'disabled'}>${ic('check')}Aprovar selecionadas</button></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Solicitação</th><th>Finalidade</th><th>Local</th><th>Data</th><th>Prazo</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
    :`<div class="empty-big"><b>Nenhuma solicitação em análise</b>Os novos pedidos dos professores aparecem aqui.</div>`}
  </section>`;
}
function aprovarClick(id){
  const r=S.res.find(x=>x.id===id);if(!r||r.status!=='pendente')return;
  const ap=aprovadaEm(r.lab,r.data,r.slot);
  if(ap)return toast('Não foi possível aprovar',`O horário já está reservado (${ap.id}). Recuse este pedido ou combine outra data.`,'bad');
  const others=pendentesEm(r.lab,r.data,r.slot).filter(x=>x.id!==r.id);
  if(!others.length){doAprovar(r);save();closeAll();renderAll();return}
  closeAll();
  const card=(x,win)=>`<div class="cconf ${win?'win':''}"><div><b>${x.id}, ${esc(x.nome)}</b><small>${esc(x.disciplina)}, ${x.alunos} pessoas. Pedido ${ago(x.criada)}.</small></div><div>${finBadge(x.fin)} ${win?'<span class="badge b-ok">Será aprovado</span>':'<span class="badge b-bad">Será recusado</span>'}</div></div>`;
  openModal({title:'Resolver conflito de horário',size:'m-lg',body:`<p style="margin:0 0 14px;color:var(--ink-2)">${LABS[r.lab].curto}, ${fD(r.data)}, ${slotOf(r.slot).h}. Ao aprovar ${r.id}, os outros pedidos deste horário são recusados com a justificativa abaixo.</p>
    ${card(r,true)}${others.map(x=>card(x,false)).join('')}
    <div class="field" style="margin-top:14px"><label for="m-motivo">Justificativa para os professores recusados</label><textarea id="m-motivo" class="input">Horário concedido a outra solicitação (${FINS[r.fin].t}, ${esc(r.disciplina)}). Por favor, escolha outra data.</textarea><span class="err" id="m-err" hidden></span></div>`,
    foot:`<button class="btn" data-act="close">Voltar</button><button class="btn primary" data-act="conflito-ok" data-id="${r.id}">${ic('check')}Aprovar ${r.id} e recusar ${others.length>1?'os demais':others[0].id}</button>`});
}
function doAprovar(r,motivoOutros){
  r.status='aprovada';hist(r,'carla','Aprovada','', 'ok');
  log('carla','Aprovou reserva',`${r.id}, ${LABS[r.lab].curto}, ${fD(r.data)}`);
  avisar(r,'aprovada');
  let n=0;
  if(motivoOutros){
    pendentesEm(r.lab,r.data,r.slot).filter(x=>x.id!==r.id).forEach(x=>{
      x.status='recusada';x.motivo=motivoOutros;hist(x,'carla','Recusada',motivoOutros,'bad');
      log('carla','Recusou reserva',`${x.id}, conflito com ${r.id}`);avisar(x,'recusada');n++;
    });
  }
  UI.filaSel.delete(r.id);
  toast('Reserva aprovada',`${r.id} confirmada${n?` e ${plural(n,'pedido recusado','pedidos recusados')} por conflito`:''}. Os professores foram avisados.`);
}
function recusarModal(id){
  const r=S.res.find(x=>x.id===id);if(!r)return;
  const quick=['Laboratório reservado para manutenção','Equipamento indisponível no horário','Capacidade insuficiente para a turma','Finalidade não compatível com o laboratório'];
  closeAll();
  openModal({title:`Recusar ${r.id}`,body:`<p style="margin:0 0 14px;color:var(--ink-2)">${esc(r.nome)} recebe a justificativa no sistema${r.email?' e por e-mail':''}.</p>
    <div class="qchips">${quick.map(q=>`<button type="button" data-act="motivo-chip" data-t="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="field"><label for="m-motivo">Justificativa</label><textarea id="m-motivo" class="input" autofocus placeholder="Explique o motivo e, se possível, sugira outra data"></textarea><span class="err" id="m-err" hidden></span></div>`,
    foot:`<button class="btn" data-act="close">Voltar</button><button class="btn primary" data-act="recusar-ok" data-id="${id}">Recusar solicitação</button>`});

function pgCheck(){
  const t=ymd(TODAY);
  const ap=S.res.filter(r=>r.status==='aprovada');
  const sets={
    hoje:ap.filter(r=>r.data===t),
    proximas:ap.filter(r=>r.data>t&&r.data<=ymd(addDays(TODAY,7))),
    pos:ap.filter(r=>r.data<t&&r.data>=ymd(addDays(TODAY,-7))&&ckProgress(r,'pos').done<ckProgress(r,'pos').total)
  };
  const labels={hoje:'Hoje',proximas:'Próximos 7 dias',pos:'Pós-aula pendente'};
  const list=sets[UI.ckTab].slice().sort((a,b)=>a.data.localeCompare(b.data)||slotIdx(a.slot)-slotIdx(b.slot));
  return phead('Checklists de aula','Preparação antes da aula e conferência depois, geradas a partir de cada reserva aprovada.')+
  `<div class="toolbar"><div class="chips">${Object.keys(sets).map(k=>`<button class="chip ${UI.ckTab===k?'on':''}" data-act="ck-tab" data-k="${k}">${labels[k]}<span class="k">${sets[k].length}</span></button>`).join('')}</div></div>
  <div class="ckgrid">${list.length?list.map(ckCard).join(''):`<section class="panel"><div class="empty-big"><b>Nada nesta lista</b>${UI.ckTab==='pos'?'Todas as conferências pós-aula estão em dia.':'Não há reservas aprovadas neste período.'}</div></section>`}</div>`;
}
function ckCard(r){
  const {pre,pos}=checkItems(r), L=LABS[r.lab], d=parseD(r.data);
  const col=(fase,items,title)=>{
    const has=ckState(r,fase), p=ckProgress(r,fase);
    return `<div class="ckcol"><h3>${title}<span>${p.done} de ${p.total}</span></h3><div class="prog"><i style="width:${p.done/p.total*100}%"></i></div>
      ${items.map(([k,t])=>`<label class="ckitem ${has(k)?'done':''}"><input type="checkbox" data-ck="${r.id}|${fase}|${k}" ${has(k)?'checked':''}><span>${esc(t)}</span></label>`).join('')}
      ${fase==='pos'?`<div class="ckacts"><button class="btn sm" data-act="problema-res" data-id="${r.id}">${ic('wrench')}Registrar problema</button><button class="btn sm" data-act="baixa-res" data-id="${r.id}">${ic('minus')}Baixa de materiais</button></div>`:''}
    </div>`;
  };
  return `<section class="panel" style="${labVars(r.lab)}">
    <div class="ckhead"><div class="dateblk sm"><span class="d">${d.getDate()}</span><span class="m">${MES[d.getMonth()]}</span></div>
      <div class="info"><b>${slotOf(r.slot).h}, ${L.curto}</b><span>${esc(r.nome)}, ${esc(r.disciplina)}, ${r.alunos} pessoas</span></div>
      ${finBadge(r.fin)}<button class="btn sm ghost" data-act="det" data-id="${r.id}">${ic('eye')}Reserva</button></div>
    <div class="ckcols">${col('pre',pre,'Antes da aula')}${col('pos',pos,'Depois da aula')}</div>
  </section>`;
}
function toggleCheck(key,val){
  const [id,fase,k]=key.split('|');
  const r=S.res.find(x=>x.id===id);
  S.check[id]=S.check[id]||{};
  const st=S.check[id][fase]=S.check[id][fase]||{};
  if(st.all){delete st.all;checkItems(r)[fase].forEach(([kk])=>st[kk]=true)}
  if(val)st[k]=true;else delete st[k];
  const p=ckProgress(r,fase);
  if(val&&p.done===p.total)log('carla',fase==='pre'?'Concluiu checklist pré-aula':'Concluiu checklist pós-aula',r.id);
  save();
  const scroll=window.scrollY;renderSide();renderMain();window.scrollTo(0,scroll);
  if(val&&p.done===p.total)toast(fase==='pre'?'Laboratório pronto':'Conferência concluída',`${r.id}, ${LABS[r.lab].curto}.`);
}

function eqSave(){
  const nome=$('#m-nome').value.trim(), modelo=$('#m-modelo').value.trim(), pat=$('#m-pat').value.trim().toUpperCase();
  const lab=$('#m-lab').value, estado=$('#m-est').value, ult=$('#m-ult').value||ymd(TODAY);
  if(!nome||!pat)return mErr('Preencha pelo menos o nome e o número de patrimônio.');
  if(S.equip.some(e=>e.pat===pat))return mErr(`O patrimônio ${pat} já está cadastrado.`);
  const base={ELE:100,HW1:200,HW2:300,BIT:400}[lab];
  const nums=S.equip.filter(e=>e.lab===lab).map(e=>+e.id.slice(3));
  const id=`EQ-${Math.max(base,...nums)+1}`;
  S.equip.push({id,nome,modelo:modelo||'Não informado',pat,lab,estado,ult,prox:ymd(addDays(parseD(ult),PREVENTIVA_DIAS))});
  log('carla','Cadastrou equipamento',`${id}, ${nome}, ${pat}`);
  closeModal();save();renderAll();
  toast('Equipamento cadastrado',`${id} já aparece nas solicitações do ${LABS[lab].curto}.`);
  qrModal(id);
}

function pgManut(){
  const f=UI.osFiltro;
  const cnt={emaberto:S.os.filter(o=>o.status!=='concluida').length,concluidas:S.os.filter(o=>o.status==='concluida').length,todas:S.os.length};
  const ord={andamento:0,aberta:1,concluida:2};
  const list=S.os.filter(o=>f==='todas'||(f==='emaberto'?o.status!=='concluida':o.status==='concluida')).sort((a,b)=>ord[a.status]-ord[b.status]||b.abertura.localeCompare(a.abertura));
  const labels={emaberto:'Em aberto',concluidas:'Concluídas',todas:'Todas'};
  const prev=S.equip.filter(e=>diffDays(parseD(e.prox),TODAY)<=30&&!osAbertas(e.id).length).sort((a,b)=>a.prox.localeCompare(b.prox));
  const rows=list.map(o=>{
    const e=eqOf(o.eqId);
    let btn='';
    if(o.status==='aberta')btn=`<button class="btn sm primary" data-act="os-start" data-id="${o.id}">Iniciar</button>`;
    if(o.status==='andamento')btn=`<button class="btn sm accent" data-act="os-done" data-id="${o.id}">${ic('check')}Concluir</button>`;
    return `<tr><td class="code">${o.id}</td><td><b>${esc(e?e.nome:o.eqId)}</b><small>${o.eqId}, ${e?LABS[e.lab].curto:''}</small></td><td>${tipobadge(o.tipo)}</td>
      <td><span class="clip" style="display:block" title="${esc(o.problema)}">${esc(o.problema)}</span>${o.solucao?`<small class="clip" title="${esc(o.solucao)}">Solução: ${esc(o.solucao)}</small>`:''}</td>
      <td>${esc(o.resp)}</td><td>${osbadge(o.status)}</td>
      <td class="num">${fDT(o.abertura).slice(0,10)}<small>${o.conclusao?`Concluída ${fDT(o.conclusao).slice(0,10)}`:o.inicio?`Iniciada ${fDT(o.inicio).slice(0,10)}`:'Aguardando início'}</small></td>
      <td class="acts">${btn}</td></tr>`;
  }).join('');
  return phead('Manutenção','Preventivas e corretivas com problema, responsável, situação, solução e datas.',`<button class="btn primary" data-act="os-new">${ic('plus')}Nova manutenção</button>`)+

  <section class="panel">${prev.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Equipamento</th><th>Laboratório</th><th>Última</th><th>Prevista para</th><th></th></tr></thead><tbody>

function osDoneOk(id){
  const sol=$('#m-sol').value.trim();
  if(!sol)return mErr('Registre a solução para manter o histórico.');
  const o=S.os.find(x=>x.id===id), e=eqOf(o.eqId);
  o.status='concluida';o.solucao=sol;o.conclusao=new Date().toISOString();if(!o.inicio)o.inicio=o.conclusao;
  e.estado=$('#m-est').value;

async function refreshStock(){
  const response=await fetch('/estoque');
  if(!response.ok)throw new Error('Não foi possível carregar o estoque.');
  Object.assign(S,await response.json());
}
let stockRequestPending=false;
async function submitStock(path,data,title){
  if(stockRequestPending)return;
  stockRequestPending=true;
  try {
    const response=await fetch(path,{method:'POST',body:new URLSearchParams(data)});
    const result=await response.json();
    if(!response.ok)return mErr(result.error || 'Não foi possível salvar.');
    closeAll();
    try {
      await refreshStock();
      renderAll();
      toast(title,result.id);
    } catch {
      toast(title,'Recarregue a página para atualizar o saldo.');
    }
  } catch {
    mErr('Não foi possível confirmar o resultado. Atualize a página antes de tentar novamente.');
  } finally {
    stockRequestPending=false;
  }
}

function copiarCompras(){
  const txt='Lista de reposição, SysLab\n'+S.itens.filter(i=>i.qtd<=i.min).map(i=>`- ${i.nome}: ${Math.max(i.min*2-i.qtd,i.min)} ${i.un} (atual ${i.qtd}, mínimo ${i.min})`).join('\n');
  const ok=()=>toast('Lista copiada','Cole no e-mail ou no pedido de compra.');
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
    else fallbackCopy(txt,ok);
  }catch(e){fallbackCopy(txt,ok)}
}
function fallbackCopy(txt,ok){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();
  let done=false;try{done=document.execCommand('copy')}catch(e){}
  ta.remove();
  if(done)ok();else toast('Não foi possível copiar','Selecione a tabela e copie manualmente.','bad');
}

/* ================= auditoria ================= */
function h32(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(16).padStart(8,'0')}
function auditCode(previous,entry){
  return h32(JSON.stringify([previous,entry.em,entry.userId,entry.acao,entry.detalhe]));
}
function initializeAudit(logs){
  let previous = '00000000';
  for(const entry of logs){
    entry.hash = auditCode(previous,entry);
    previous = entry.hash;
  }
  return {count:logs.length,hash:previous};
}
function auditIsValid(logs,head){
  let previous = '00000000';
  for(const entry of logs){
    const expected = auditCode(previous,entry);
    if(entry.hash !== expected)return false;
    previous = expected;
  }
  return head?.count === logs.length && head.hash === previous;
}
function pgLogs(){
  const valid = auditIsValid(S.logs,S.auditHead);
  const perfis=[...new Set(S.logs.map(l=>PEOPLE[l.userId].perfil))];
  return phead('Registro de auditoria','Tudo o que acontece no sistema, em ordem. Consulta somente leitura.')+`
  <section class="panel integrity"><span class="shield">${ic('shield')}</span><div><b>${S.logs.length} registros · ${valid?'Cadeia íntegra':'Falha na verificação da cadeia'}</b><span>O sistema compara os códigos gravados com os códigos recalculados para detectar inconsistências nos registros locais.</span></div></section>
  <div class="toolbar"><div class="search">${ic('search')}<input class="input" data-f="tiBusca" value="${esc(UI.tiBusca)}" placeholder="Buscar ação, pessoa ou código" aria-label="Buscar no registro"></div>
    <select class="input" data-f="tiPerfil" aria-label="Perfil"><option value="todos">Todos os perfis</option>${perfis.map(p=>`<option ${UI.tiPerfil===p?'selected':''}>${p}</option>`).join('')}</select></div>
  <section class="panel" id="tbl-logs"></section>`;
}

  const el=$('#tbl-logs');if(!el)return;
  const q=UI.tiBusca.trim().toLowerCase();
  const list=S.logs.filter(l=>(UI.tiPerfil==='todos'||PEOPLE[l.userId].perfil===UI.tiPerfil)&&(!q||`${l.acao} ${l.detalhe} ${PEOPLE[l.userId].nome}`.toLowerCase().includes(q))).reverse();
  el.innerHTML=list.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Data e hora</th><th>Pessoa</th><th>Perfil</th><th>Ação</th><th>Detalhe</th><th>Código</th></tr></thead><tbody>
    ${list.map(l=>`<tr><td class="num">${fDT(l.em)}</td><td><b>${esc(PEOPLE[l.userId].nome)}</b></td><td><span class="badge ${l.userId==='sistema'?'b-info':'b-mute'}">${PEOPLE[l.userId].perfil}</span></td><td>${esc(l.acao)}</td><td>${esc(l.detalhe)}</td><td><span class="hash">${esc(l.hash ?? "—")}</span></td></tr>`).join('')}
  </tbody></table></div>`:`<div class="empty-big"><b>Nenhum registro encontrado</b>Ajuste a busca ou o filtro.</div>`;
}

/* ================= eventos ================= */
function go(v){if(v==='almox')refreshStock().then(()=>{if(UI.view==='almox')renderMain()}).catch(()=>toast('Falha ao atualizar estoque','Recarregue a página para tentar novamente.','bad'));UI.view=v;closeAll();renderSide();renderMain();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(UI.bell&&!e.target.closest('#bellpop')&&!(el&&el.dataset.act==='bell')){UI.bell=false;renderBell();renderTop()}
  if(!el||el.disabled)return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'nav':go(el.dataset.v);break;
    case 'nav-fila':go('fila');break;
    case 'bell':UI.bell=!UI.bell;renderBell();renderTop();break;
    case 'readall':S.notifs.forEach(n=>{if(n.userId===me().id)n.lida=true});save();renderTop();renderBell();break;
    case 'reset':openModal({title:'Restaurar demonstração',body:'<p style="margin:0">Os dados voltam ao estado inicial. Reservas, manutenções, materiais e registros criados durante a apresentação serão descartados.</p>',foot:'<button class="btn" data-act="close" autofocus>Voltar</button><button class="btn primary" data-act="reset-ok">Restaurar dados</button>'});break;
    case 'reset-ok':{const role=S.role;const {itens,movs}=S;S=seed();Object.assign(S,{role,itens,movs});UI.form=blankForm();UI.filaSel.clear();save();closeAll();renderAll();toast('Demonstração restaurada','Os dados voltaram ao estado inicial.');break}
    case 'labtab':UI.lab=el.dataset.lab;renderAgenda();break;
    case 'fc-open':openFC();break;
    case 'fc-m':{const m=UI.fc.month;UI.fc.month=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.n),1);renderFC();break}
    case 'fc-day':{const d=parseD(el.dataset.d);UI.fc.week=sow(d);if(d.getMonth()!==UI.fc.month.getMonth())UI.fc.month=new Date(d.getFullYear(),d.getMonth(),1);renderFC();break}
    case 'fc-w':{UI.fc.week=addDays(UI.fc.week,+el.dataset.n);const mid=addDays(UI.fc.week,2);UI.fc.month=new Date(mid.getFullYear(),mid.getMonth(),1);renderFC();break}
    case 'fc-today':UI.fc.week=sow(TODAY);UI.fc.month=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);renderFC();break;
    case 'fc-book':closeAll();prefill(UI.lab,el.dataset.date,el.dataset.slot);break;
    case 'cell-detail':cellDetail(el.dataset.lab,el.dataset.date,el.dataset.slot);break;
    case 'cell-book':closeAll();prefill(el.dataset.lab,el.dataset.date,el.dataset.slot);break;
    case 'form-lab':if(UI.form.lab!==el.dataset.lab){UI.form.lab=el.dataset.lab;UI.form.hw=[];renderForm()}break;
    case 'form-fin':UI.form.fin=el.dataset.k;renderForm();break;
    case 'form-clear':UI.form=blankForm();renderForm();break;
    case 'form-send':enviar();break;
    case 'minhas-f':UI.minhas=el.dataset.k;renderMain();break;
    case 'det':detalhes(id);break;
    case 'cancel':closeAll();cancelarModal(id);break;
    case 'cancel-ok':cancelarOk(id);break;
    case 'rebook':{const r=S.res.find(x=>x.id===id);if(r){go('agenda');prefill(r.lab,'','',{fin:r.fin,disciplina:r.disciplina,alunos:String(r.alunos),tccAlunos:r.tccAlunos,materiais:r.materiais,roteiro:r.roteiro});UI.form.hw=[...r.hw];renderForm();toast('Escolha uma nova data','Os dados do pedido anterior já estão no formulário.')}break}
    case 'problema':problemaModal(id);break;
    case 'problema-res':problemaModal(id);break;
    case 'problema-ok':problemaOk();break;
    case 'baixa-res':movModal('saida','',id);break;
    case 'aprovar':aprovarClick(id);break;
    case 'conflito-ok':{const m=$('#m-motivo').value.trim();if(!m)return mErr('A justificativa é obrigatória.');const r=S.res.find(x=>x.id===id);if(r){doAprovar(r,m);save();closeAll();renderAll()}break}
    case 'aprovar-lote':{
      const rs=[...UI.filaSel].map(i=>S.res.find(r=>r.id===i)).filter(r=>r&&r.status==='pendente');
      let ok=0,skip=0;
      rs.forEach(r=>{
        if(r.status!=='pendente')return;
        if(aprovadaEm(r.lab,r.data,r.slot)||pendentesEm(r.lab,r.data,r.slot).length>1){skip++;return}
        r.status='aprovada';hist(r,'carla','Aprovada','','ok');log('carla','Aprovou reserva',`${r.id}, aprovação em lote`);avisar(r,'aprovada');ok++;
      });
      UI.filaSel.clear();save();renderAll();
      toast(`${plural(ok,'reserva aprovada','reservas aprovadas')}`,skip?`${plural(skip,'pedido ficou','pedidos ficaram')} de fora por conflito de horário. Resolva um a um.`:'Os professores foram avisados.',ok?'ok':'bad');
      break;
    }
    case 'recusar':recusarModal(id);break;
    case 'motivo-chip':{const t=$('#m-motivo');t.value=el.dataset.t+'. ';t.focus();break}
    case 'recusar-ok':{
      const m=$('#m-motivo').value.trim();
      if(!m)return mErr('Escreva a justificativa. Ela fica no histórico e vai para o professor.');
      const r=S.res.find(x=>x.id===id);
      if(r){r.status='recusada';r.motivo=m;hist(r,'carla','Recusada',m,'bad');log('carla','Recusou reserva',`${r.id}, ${m}`);avisar(r,'recusada');UI.filaSel.delete(id);save();closeAll();renderAll();toast('Solicitação recusada',`${r.nome} recebeu a justificativa.`)}
      break;
    }
    case 'ck-tab':UI.ckTab=el.dataset.k;renderMain();break;
    case 'eq-sit':UI.eqSit=el.dataset.k;renderMain();break;
    case 'eq-new':eqNew();break;
    case 'eq-save':eqSave();break;
    case 'eq-hist':eqHist(id);break;
    case 'qr':qrModal(id);break;
    case 'os-f':UI.osFiltro=el.dataset.k;renderMain();break;
    case 'os-new':osNew(el.dataset.eq||'');break;
    case 'os-prev':osNew(el.dataset.eq,'preventiva');break;
    case 'os-save':osSave();break;
    case 'os-start':osStart(id);break;
    case 'os-done':osDoneModal(id);break;
    case 'os-done-ok':osDoneOk(id);break;
    case 'mov':movModal(el.dataset.t,id||'');break;
    case 'mov-ok':movOk(el.dataset.t,el.dataset.res);break;
    case 'item-new':itemNew();break;
    case 'item-save':itemSave();break;
    case 'compras':comprasModal();break;
    case 'copiar-compras':copiarCompras();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target, f=t.dataset.f;
  if(!f)return;
  if(['disciplina','alunos','tccAlunos','materiais','obs'].includes(f)){
    UI.form[f]=t.value;
    if(t.classList.contains('bad')){t.classList.remove('bad');const er=t.parentElement.querySelector('.err');if(er)er.remove()}
  }
  else if(f==='eqBusca'){UI.eqBusca=t.value;renderEquipTable()}
  else if(f==='alBusca'){UI.alBusca=t.value;renderItensTable()}
  else if(f==='tiBusca'){UI.tiBusca=t.value;renderLogTable()}
});
document.addEventListener('change',e=>{
  const t=e.target, f=t.dataset.f;
  if(t.dataset.hw){
    const id=t.dataset.hw;
    UI.form.hw=t.checked?[...new Set([...UI.form.hw,id])]:UI.form.hw.filter(x=>x!==id);
    t.closest('.hwi').classList.toggle('on',t.checked);return;
  }
  if(t.dataset.ck){toggleCheck(t.dataset.ck,t.checked);return}
  if(t.dataset.sel){t.checked?UI.filaSel.add(t.dataset.sel):UI.filaSel.delete(t.dataset.sel);renderMain();return}
  if(t.hasAttribute('data-selall')){
    if(t.checked)$('#main').querySelectorAll('[data-sel]').forEach(c=>UI.filaSel.add(c.dataset.sel));else UI.filaSel.clear();
    renderMain();return;
  }
  const clearErr=()=>{if(t.classList.contains('bad')){t.classList.remove('bad');const er=t.parentElement.querySelector('.err');if(er)er.remove()}};
  switch(f){
    case 'data':UI.form.data=t.value;clearErr();renderDyn();break;
    case 'slot':UI.form.slot=t.value;clearErr();renderDyn();break;
    case 'email':UI.form.email=t.checked;break;
    case 'roteiro':UI.form.roteiro=(t.files&&t.files[0])?t.files[0].name:UI.form.roteiro;renderForm();break;
    case 'eqLab':UI.eqLab=t.value;renderEquipTable();break;
    case 'tiPerfil':UI.tiPerfil=t.value;renderLogTable();break;
    case 'filaLab':UI.filaLab=t.value;renderMain();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modals.length)closeModal();else if(UI.bell){UI.bell=false;renderBell();renderTop()}}
});

renderAll();

</script>
</body>
</html>
